name: Run SaveHalf Scraper

on:
  # Run automatically every Wednesday at 8:00 AM AEST (22:00 UTC on Tuesday)
  schedule:
    - cron: '0 22 * * 2'
  
  # Allows you to run the script manually anytime from the GitHub UI for testing
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install required Python packages
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pdfplumber google-genai supabase beautifulsoup4

      # 4. Execute the scraper with secure environment variables
      - name: Run Scraper Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper.py